<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MathBank · 备课工作台</title>
<link rel="icon" href="/static/favicon.png"><script src="/platform/web/appearance.js"></script>
<link rel="stylesheet" href="/static/lib/font-awesome/css/all.min.css"><link rel="stylesheet" href="/static/css/app.css"><link rel="stylesheet" href="/platform/web/platform.css"></head>
<body class="mb-portal">
<section id="login" class="mb-login" hidden aria-labelledby="loginTitle">
  <div class="mb-login-brand"><span class="app-nav-logo"><img src="/static/favicon.png" alt=""></span><div><strong>MathBank</strong><span>备课工作台</span></div></div>
  <div class="mb-login-layout">
    <div class="mb-login-intro"><span class="mb-badge">题目 · 试卷 · 协作</span><h1>从一道题，<br>到一堂好课。</h1><p>在自己的空间备课，在团队空间协作。<br>每个空间对应一个学科、学段与教材。</p>
      <div class="mb-login-features"><span><i class="fa-regular fa-image" aria-hidden="true"></i>图片识题</span><span><i class="fa-regular fa-file-lines" aria-hidden="true"></i>试卷导入</span><span><i class="fa-solid fa-layer-group" aria-hidden="true"></i>智能组卷</span></div></div>
    <form id="loginForm" class="mb-login-form"><h2 id="loginTitle">登录 MathBank</h2><p>使用管理员分配的账号继续备课。</p>
      <label>账号<input name="username" autocomplete="username" required placeholder="输入账号"></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required placeholder="输入密码"></label>
      <p id="loginError" class="mb-dialog-error" role="alert" hidden></p>
      <button class="mb-button mb-primary">登录</button><small>忘记密码或需要账号？请联系所属团队管理员。</small></form>
  </div>
  <footer>正式入库的题目按空间权限共享。</footer>
</section>
<div id="portalShell" hidden>
  <aside id="appNavigation" class="app-navigation" aria-label="MathBank 主导航">
    <div class="app-nav-brand"><span class="app-nav-logo"><img src="/static/favicon.png" alt=""></span><span class="app-nav-brand-copy"><strong>MathBank</strong><small>备课工作台</small></span></div>
    <div class="app-nav-section-label">工作区</div>
    <nav id="appNavPrimary" class="app-nav-primary" aria-label="主要工作区">
      <button type="button" id="appNavQa" class="app-nav-item" data-app-nav-target="qa"><i class="fa-regular fa-circle-question" aria-hidden="true"></i><span>Q&amp;A</span></button>
    </nav>
    <div class="app-nav-spacer"></div><p class="mb-onboarding-note">先新建一个空间，选择学科、学段与教材后开始备课。</p>
  </aside>
  <div class="app-content-shell"><header class="mb-portal-header"><strong>MathBank</strong><span>账号与空间</span>
    <button id="portalTheme" class="mb-icon-button" type="button" aria-label="切换明暗模式"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button></header>
    <main>
      <section id="qaWorkspaceSection" class="qa-workspace hidden" aria-labelledby="qaWorkspaceTitle"><div class="qa-workspace-content">
        <div class="qa-heading"><h2 id="qaWorkspaceTitle">Q&amp;A · 使用帮助</h2><p id="qaSourceNote" class="qa-source-note"></p></div>
        <div class="qa-search-row"><label for="qaSearchInput" class="sr-only">搜索常见问题</label><div class="qa-search-box"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input type="search" id="qaSearchInput" autocomplete="off"></div><button type="button" id="qaResetFilters" class="qa-reset">重置</button></div>
        <div id="qaCategories" class="qa-categories" role="group" aria-label="按主题筛选问答"></div>
        <p id="qaResultCount" class="qa-result-count" role="status" aria-live="polite"></p>
        <div id="qaQuestionList" class="qa-question-list"></div>
        <div id="qaEmptyState" class="qa-empty-state" hidden><h3>没有匹配的问题</h3><p>换个关键词，或重置筛选查看全部问答。</p></div>
      </div></section>
      <!-- ACCOUNT_WORKSPACE -->
    </main>
  </div>
</div>
<script src="/platform/web/qa-data.js"></script><script src="/platform/web/qa.js"></script><script src="/platform/web/account.js"></script>
</body></html>
